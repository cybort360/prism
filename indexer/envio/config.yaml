name: prism-indexer
description: >-
  Indexes Prism's real Monad activity, payments, claims, and relevant USDC transfers, into a
  queryable GraphQL API the Prism backend consumes for reconciled historical activity. The chain
  stays canonical; Envio provides indexed, queryable history and product activity, never financial
  truth on its own.
# Monad testnet (chainId 10143). Envio HyperSync/HyperIndex support Monad with full history from
# block 0 (HyperSync auto-finds each contract's first block). Addresses below are the DEMO
# environment (mock-pinned router + mintable MockUSDC); see indexer/envio/README.md.

# event.transaction.hash is not selected by default — the handlers need it for txHash fields.
field_selection:
  transaction_fields:
    - hash

networks:
  - id: 10143
    start_block: 0
    contracts:
      - name: PrismPaymentRouter
        address:
          - "0x80e00BF20F027C9BF69926280c4A18Df1bDd06e0" # PrismPaymentRouter (mock-USDC-pinned, demo)
        handler: src/EventHandlers.ts
        events:
          - event: "PaymentSettled(bytes32 indexed paymentId, address indexed payer, address indexed recipient, uint256 amount, bytes32 requestId, bytes32 resolutionHash)"
      - name: PrismClaimVault
        address:
          - "0xBe3D0b0404674e032D153182a58b1901D1d6Eae3" # deployed PrismClaimVault
        handler: src/EventHandlers.ts
        events:
          - event: "ClaimFunded(bytes32 indexed claimId, address indexed sender, uint256 amount, uint256 expiry, bytes32 recipientReference)"
          - event: "ClaimCollected(bytes32 indexed claimId, address indexed recipient, uint256 amount)"
          - event: "ClaimRefunded(bytes32 indexed claimId, address indexed sender, uint256 amount)"
      - name: USDC
        address:
          - "0xCe156f17CBc2A57EE04E6e7F95C9e9AC9243d9A7" # MockUSDC (demo, mintable)
        handler: src/EventHandlers.ts
        events:
          - event: "Transfer(address indexed from, address indexed to, uint256 value)"
