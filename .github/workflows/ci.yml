name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # The backend reads configuration from process.env only — it never loads a .env file —
      # so the suite runs on config.js defaults with no secrets provisioned.
      - name: Test
        run: node --test test/*.test.js

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # contracts/lib is git-ignored, so the dependency is fetched per run.
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      # The vault invariant suite (256 runs / 128k calls) dominates the ~2.5 min runtime.
      - name: Test
        run: forge test -vv

  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ios/MeraBridge/web/package-lock.json

      # mera-bridge.js is a git-ignored build artifact; XcodeGen ships MeraWeb/ as an app
      # resource, so the bundle has to exist before the project is generated.
      - name: Build Mera bridge bundle
        working-directory: ios/MeraBridge/web
        run: |
          npm ci
          npm run build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve simulator destination
        id: sim
        run: echo "destination=$(./scripts/ios-destination.sh)" >> "$GITHUB_OUTPUT"

      # Simulator builds need no signing identity; project.yml leaves DEVELOPMENT_TEAM empty.
      - name: Test
        working-directory: ios
        run: |
          xcodebuild -project Prism.xcodeproj -scheme Prism -sdk iphonesimulator \
            -destination '${{ steps.sim.outputs.destination }}' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            test
