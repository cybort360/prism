name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # circles-limits.test.js imports tools/circles/verify-allowance-module.mjs, which depends on
      # viem from tools/circles/node_modules (a separate package, not installed by backend's npm ci).
      # Without this the version-floor vector errors with ERR_MODULE_NOT_FOUND 'viem'.
      - name: Install tools/circles deps
        working-directory: tools/circles
        run: npm install --no-audit --no-fund

      # The backend reads configuration from process.env only — it never loads a .env file —
      # so the suite runs on config.js defaults with no secrets provisioned.
      - name: Test
        run: node --test test/*.test.js

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # contracts/lib is git-ignored, so the dependency is fetched per run.
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      # The vault invariant suite (256 runs / 128k calls) dominates the ~2.5 min runtime.
      # The Circles suite is excluded here and runs as its own job: it forks Monad testnet.
      - name: Test
        run: forge test -vv --no-match-path 'test/circles/*'

  circles:
    name: Circles architecture proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-git

      # Runs against the real Safe v1.4.1 deployment on a Monad testnet fork, the real EIP-7951
      # P-256 precompile and the real USDC contract. `--network monad` is mandatory: without it a
      # call to the precompile returns empty output and every P-256 assertion becomes vacuous.
      - name: Safe owner compatibility, vectors and relayer model
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: circles
          MONAD_TESTNET_RPC_URL: https://testnet-rpc.monad.xyz
        run: forge test --match-path 'test/circles/*' --network monad -vv

      # Independently re-derives every Safe transaction hash with the official protocol-kit and
      # confirms the committed Swift fixture is still in step with the vector file.
      - name: Cross-check vectors against the official Safe protocol-kit
        working-directory: tools/circles
        run: |
          npm install
          npm run verify
          npm run fixture
          git diff --exit-code -- ../../ios/PrismTests/CircleSafeTxVectorsFixture.swift

  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ios/MeraBridge/web/package-lock.json

      # mera-bridge.js is a git-ignored build artifact; XcodeGen ships MeraWeb/ as an app
      # resource, so the bundle has to exist before the project is generated.
      - name: Build Mera bridge bundle
        working-directory: ios/MeraBridge/web
        run: |
          npm ci
          npm run build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # OnboardingFlowUITests drives the real onboarding flow against a real backend. Without one
      # the UI test cannot pass, so CI starts the dev backend the app already defaults to
      # (PRISM_API_BASE_URL http://127.0.0.1:8787). Dev adapters only: no Twilio, no relayer.
      - name: Start dev backend
        working-directory: backend
        run: |
          npm ci
          # nohup + detach so the server survives the end of this step's shell.
          STORE_PATH=./data/ci-store.json nohup node src/server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then
              echo "backend up:"; curl -sS http://127.0.0.1:8787/health; echo; exit 0
            fi
            sleep 1
          done
          echo "backend failed to start; log:"; cat "$RUNNER_TEMP/backend.log"; exit 1

      - name: Resolve simulator destination
        id: sim
        run: echo "destination=$(./scripts/ios-destination.sh)" >> "$GITHUB_OUTPUT"

      # Simulator builds need no *real* signing identity (project.yml leaves DEVELOPMENT_TEAM
      # empty), but they do need ad-hoc signing: with CODE_SIGNING_ALLOWED=NO the app is built
      # without entitlements, so it has no application-identifier and every Keychain write fails
      # with errSecMissingEntitlement. Onboarding stores the PIN and the dev signer seed in the
      # Keychain, so it cannot complete. Keep CODE_SIGNING_REQUIRED=NO and let the simulator's
      # default ad-hoc identity ("-") apply the entitlements.
      - name: Test
        id: xcodebuild
        working-directory: ios
        run: |
          xcodebuild -project Prism.xcodeproj -scheme Prism -sdk iphonesimulator \
            -destination '${{ steps.sim.outputs.destination }}' \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Backend log
        if: failure() && steps.xcodebuild.outcome == 'failure'
        run: cat "$RUNNER_TEMP/backend.log" || true
